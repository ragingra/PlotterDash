<section class="mb-4">
  <h2>Serial Connection</h2>

  <!-- Connect Form - shown when not connected -->
  <form
    id="connectForm"
    class="row g-2"
    hx-post="/connect"
    hx-target="#connection-status"
    hx-swap="innerHTML"
    x-show="!isConnected"
  >
    <div class="col-auto">
      <label for="port" class="form-label">Port:</label>
      <select name="port" id="port" class="form-select">
        {% for p in port_list %}
        <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-auto">
      <label for="baud" class="form-label">Baud:</label>
      <input
        type="number"
        name="baud"
        id="baud"
        class="form-control"
        value="9600"
      />
    </div>
    <div class="col-auto align-self-end">
      <button type="submit" class="btn btn-primary">Connect</button>
    </div>
  </form>

  <!-- Connection Status + Disconnect - shown when connected -->
  <div id="connection-status" x-show="isConnected">
    <div class="d-flex align-items-center gap-3">
      <span class="badge bg-success">Connected</span>
      <form hx-post="/disconnect" hx-target="#connection-status" hx-swap="innerHTML">
        <button class="btn btn-warning btn-sm">Disconnect</button>
      </form>
    </div>
  </div>
</section>
