<!-- templates/layout.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PlotterDash</title>

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
      .progress-bar-animated {
        transition: width 0.3s ease;
      }
      .color-swatch {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        border: 1px solid #ccc;
        display: inline-block;
      }
      .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 1050;
      }
      .fade-enter {
        opacity: 0;
        transform: translateY(-10px);
      }
      .fade-enter-active {
        opacity: 1;
        transform: translateY(0);
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body x-data="appState()">
    <!-- Toast Container -->
    <div class="toast-container">
      <template x-for="(toast, index) in toasts" :key="index">
        <div
          class="toast show mb-2"
          :class="{'bg-success text-white': toast.type === 'success', 'bg-danger text-white': toast.type === 'error', 'bg-info text-white': toast.type === 'info'}"
          role="alert"
        >
          <div class="toast-body d-flex justify-content-between align-items-center">
            <span x-text="toast.message"></span>
            <button type="button" class="btn-close btn-close-white ms-2" @click="removeToast(index)"></button>
          </div>
        </div>
      </template>
    </div>

    <div class="container my-4">{% block content %}{% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Alpine.js App State -->
    <script>
      function appState() {
        return {
          isConnected: false,
          isRunning: false,
          isPaused: false,
          jobs: {},
          lastCustomCommand: "",
          lastCustomResponse: "",
          toasts: [],
          previousJobStatuses: {},

          init() {
            this.startSSE();
          },

          startSSE() {
            const evtSource = new EventSource("/job_status_stream");
            evtSource.onmessage = (event) => {
              const data = JSON.parse(event.data);
              this.handleSSEUpdate(data);
            };
            evtSource.onerror = (e) => {
              console.log("SSE connection error:", e);
            };
          },

          handleSSEUpdate(data) {
            // Detect connection state changes
            if (data.is_connected !== this.isConnected) {
              if (data.is_connected) {
                this.addToast("Connected to plotter", "success");
              } else {
                this.addToast("Disconnected from plotter", "info");
              }
            }

            // Detect job status changes
            for (let jobId in data.jobs) {
              const job = data.jobs[jobId];
              const prevStatus = this.previousJobStatuses[jobId];

              if (!prevStatus && job.status === "queued") {
                this.addToast(`Job queued: ${job.filename}`, "info");
              } else if (prevStatus !== job.status) {
                if (job.status === "running" && prevStatus === "queued") {
                  this.addToast(`Job started: ${job.filename}`, "info");
                } else if (job.status === "done") {
                  this.addToast(`Job completed: ${job.filename}`, "success");
                } else if (job.status === "error") {
                  this.addToast(`Job failed: ${job.filename}`, "error");
                } else if (job.status === "stopped") {
                  this.addToast(`Job stopped: ${job.filename}`, "info");
                }
              }
              this.previousJobStatuses[jobId] = job.status;
            }

            // Update state
            this.isConnected = data.is_connected;
            this.isRunning = data.is_running;
            this.isPaused = data.is_paused;
            this.jobs = data.jobs;
            this.lastCustomCommand = data.last_custom_command || "";
            this.lastCustomResponse = data.last_custom_response || "";
          },

          addToast(message, type = "info") {
            this.toasts.push({ message, type });
            // Auto-remove after 4 seconds
            setTimeout(() => {
              this.toasts.shift();
            }, 4000);
          },

          removeToast(index) {
            this.toasts.splice(index, 1);
          },

          getJobsArray() {
            return Object.values(this.jobs).sort((a, b) => {
              // Running jobs first, then queued, then done
              const order = { running: 0, queued: 1, done: 2, stopped: 3, error: 4 };
              return (order[a.status] || 5) - (order[b.status] || 5);
            });
          }
        };
      }
    </script>

    <!-- Move Command JS -->
    <script>
      function updateMoveCommand(evt, direction) {
        const formEl = evt.target;
        const hiddenInput = formEl.querySelector('input[name="command"]');

        // Check if the penDownCb is checked => "PD", else "PU"
        const penDownCb = document.getElementById("penDownCb");
        const penPrefix = penDownCb && penDownCb.checked ? "PD" : "PU";

        // Distance from #moveDistance
        const moveDistEl = document.getElementById("moveDistance");
        let dist = 100;
        if (moveDistEl) {
          const distStr = moveDistEl.value || "100";
          dist = parseInt(distStr, 10) || 100;
        }

        let coords = "0," + dist;
        if (direction === "down") {
          coords = "0,-" + dist;
        } else if (direction === "left") {
          coords = "-" + dist + ",0";
        } else if (direction === "right") {
          coords = dist + ",0";
        }

        const cmd = penPrefix + coords;
        hiddenInput.value = cmd;
      }
    </script>
  </body>
</html>
