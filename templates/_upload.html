<section id="uploadSection" class="mb-4" x-show="isConnected">
  <hr />
  <h2>Upload SVG</h2>

  <!-- File selection form -->
  <form
    id="uploadForm"
    hx-post="/analyze_svg"
    hx-target="#color-preview"
    hx-swap="innerHTML"
    hx-encoding="multipart/form-data"
    class="row g-2"
  >
    <div class="col-12">
      <label class="form-label">Choose SVG file:</label>
      <input
        type="file"
        name="svg_file"
        accept=".svg"
        class="form-control"
        required
      />
    </div>
    <div class="col-md-6">
      <label class="form-label">Pen Speed (1-10):</label>
      <input type="number" name="pen_speed" value="1" min="1" max="10" class="form-control" />
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-secondary mt-2">Analyze Colors</button>
    </div>
  </form>

  <!-- Color preview and pen assignment (populated by HTMX) -->
  <div id="color-preview" class="mt-3"></div>
</section>
