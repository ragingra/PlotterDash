<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span><i class="bi bi-file-earmark-image me-2"></i>Plot an SVG</span>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#pensModal">
      <i class="bi bi-palette me-1"></i>Pens
    </button>
  </div>
  <div class="card-body">
    <form id="uploadForm" hx-post="/analyze" hx-target="#assignment" hx-swap="innerHTML" hx-encoding="multipart/form-data"
          hx-indicator="#analyzeSpinner" class="d-flex flex-wrap gap-2 align-items-end">
      <div class="flex-fill" style="min-width: 16rem;">
        <input type="file" name="svg_file" accept=".svg,image/svg+xml" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary">
        <span id="analyzeSpinner" class="htmx-indicator spinner-border spinner-border-sm me-1"></span>
        Analyse
      </button>
    </form>
    <div class="small text-muted mt-2">Strokes are grouped by colour so each colour can go to a different pen. Paths without a stroke colour count as black.</div>

    <div id="assignment" class="mt-3"></div>
    <div id="preview" class="mt-3"></div>
  </div>
</div>
