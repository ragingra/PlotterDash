<!-- templates/_custom_commands.html -->
<section id="customCommandsSection" class="mb-4" x-show="isConnected && !isRunning">
  <hr />
  <h2>Custom Commands</h2>

  <!-- Freeform command form -->
  <form
    class="row g-2 mb-3"
    hx-post="/send_command"
    hx-swap="none"
  >
    <div class="col-auto flex-grow-1">
      <input
        id="customCmd"
        type="text"
        name="command"
        placeholder="e.g. PU0,0;PD100,200"
        class="form-control"
      />
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary">Send</button>
    </div>
  </form>

  <!-- Quick commands -->
  <div class="d-flex flex-wrap gap-2 mb-3">
    <form hx-post="/send_command" hx-swap="none">
      <input type="hidden" name="command" value="PU" />
      <button class="btn btn-outline-secondary btn-sm">PU (Pen Up)</button>
    </form>
    <form hx-post="/send_command" hx-swap="none">
      <input type="hidden" name="command" value="PD" />
      <button class="btn btn-outline-secondary btn-sm">PD (Pen Down)</button>
    </form>
    <form hx-post="/send_command" hx-swap="none">
      <input type="hidden" name="command" value="SP0" />
      <button class="btn btn-outline-secondary btn-sm">SP0</button>
    </form>
    <form hx-post="/send_command" hx-swap="none">
      <input type="hidden" name="command" value="SP1" />
      <button class="btn btn-outline-secondary btn-sm">SP1</button>
    </form>
    <form hx-post="/send_command" hx-swap="none">
      <input type="hidden" name="command" value="SP2" />
      <button class="btn btn-outline-secondary btn-sm">SP2</button>
    </form>
    <form hx-post="/send_command" hx-swap="none">
      <input type="hidden" name="command" value="IN" />
      <button class="btn btn-outline-secondary btn-sm">IN (Initialize)</button>
    </form>
  </div>

  <!-- Movement controls -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <!-- Pen Down checkbox -->
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="penDownCb" />
          <label class="form-check-label" for="penDownCb">Pen Down</label>
        </div>

        <!-- Distance input -->
        <div class="d-flex align-items-center gap-2">
          <label for="moveDistance" class="form-label mb-0">Distance:</label>
          <input
            type="number"
            id="moveDistance"
            value="100"
            class="form-control form-control-sm"
            style="width: 80px"
          />
        </div>

        <!-- Direction buttons -->
        <div class="btn-group">
          <form hx-post="/send_command" hx-swap="none" onsubmit="updateMoveCommand(event, 'up')">
            <input type="hidden" name="command" value="PU0,100" />
            <button class="btn btn-outline-primary btn-sm">&#8593;</button>
          </form>
          <form hx-post="/send_command" hx-swap="none" onsubmit="updateMoveCommand(event, 'down')">
            <input type="hidden" name="command" value="PU0,-100" />
            <button class="btn btn-outline-primary btn-sm">&#8595;</button>
          </form>
          <form hx-post="/send_command" hx-swap="none" onsubmit="updateMoveCommand(event, 'left')">
            <input type="hidden" name="command" value="PU-100,0" />
            <button class="btn btn-outline-primary btn-sm">&#8592;</button>
          </form>
          <form hx-post="/send_command" hx-swap="none" onsubmit="updateMoveCommand(event, 'right')">
            <input type="hidden" name="command" value="PU100,0" />
            <button class="btn btn-outline-primary btn-sm">&#8594;</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Last command/response display -->
  <div class="card bg-light">
    <div class="card-body py-2">
      <small>
        <strong>Last:</strong>
        <code x-text="lastCustomCommand || '-'"></code>
        <span class="text-muted mx-2">|</span>
        <strong>Response:</strong>
        <code x-text="lastCustomResponse || '-'"></code>
      </small>
    </div>
  </div>
</section>
