<!-- Color assignment partial - returned by /analyze_svg -->
<div class="card">
  <div class="card-header">
    <strong>{{ filename }}</strong> - {{ colors|length }} color(s) detected
  </div>
  <div class="card-body">
    <form
      hx-post="/upload_svg"
      hx-target="#color-preview"
      hx-swap="innerHTML"
      hx-encoding="multipart/form-data"
    >
      <!-- Hidden fields for file info -->
      <input type="hidden" name="filepath" value="{{ filepath }}" />
      <input type="hidden" name="filename" value="{{ filename }}" />
      <input type="hidden" name="pen_speed" value="{{ pen_speed }}" />

      {% if colors %}
      <p class="text-muted mb-3">Assign each color to a pen (1-8):</p>

      <div class="row g-3 mb-3">
        {% for color in colors %}
        <div class="col-6 col-md-4 col-lg-3">
          <div class="d-flex align-items-center gap-2 p-2 border rounded">
            <span class="color-swatch" style="background-color: {{ color }};"></span>
            <select name="pen_{{ color }}" class="form-select form-select-sm" style="width: auto;">
              {% for pen in range(1, 9) %}
              <option value="{{ pen }}" {% if loop.index == loop.first %}selected{% endif %}>Pen {{ pen }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-muted mb-3">No stroke colors detected. Using default pen 1.</p>
      <input type="hidden" name="pen_#000000" value="1" />
      {% endif %}

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill me-1" viewBox="0 0 16 16">
            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
          </svg>
          Queue Job
        </button>
        <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('color-preview').innerHTML = ''">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
