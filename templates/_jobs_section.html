<!-- templates/_jobs_section.html -->
<section id="jobsSection" x-show="isConnected && Object.keys(jobs).length > 0">
  <hr />
  <h2>Jobs</h2>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="table-light">
        <tr>
          <th>Filename</th>
          <th>Status</th>
          <th style="width: 200px;">Progress</th>
          <th>Pen</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="job in getJobsArray()" :key="job.job_id">
          <tr>
            <td>
              <span x-text="job.filename" class="fw-medium"></span>
            </td>
            <td>
              <span
                class="badge"
                :class="{
                  'bg-primary': job.status === 'running',
                  'bg-secondary': job.status === 'queued',
                  'bg-success': job.status === 'done',
                  'bg-danger': job.status === 'error',
                  'bg-warning text-dark': job.status === 'stopped'
                }"
                x-text="job.status"
              ></span>
            </td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="progress flex-grow-1" style="height: 8px;">
                  <div
                    class="progress-bar progress-bar-animated"
                    :class="{'progress-bar-striped': job.status === 'running'}"
                    role="progressbar"
                    :style="'width: ' + (job.progress_percent || 0) + '%'"
                    :aria-valuenow="job.progress_percent || 0"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
                <span class="text-muted small" style="min-width: 35px;" x-text="(job.progress_percent || 0) + '%'"></span>
              </div>
            </td>
            <td>
              <span class="text-muted" x-text="'Pen ' + job.pen_number + ' @ speed ' + job.pen_speed"></span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</section>
