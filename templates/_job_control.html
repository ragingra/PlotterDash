<!-- templates/_job_control.html -->
<section id="jobControlSection" class="mb-4" x-show="isConnected && isRunning">
  <hr />
  <h2>Job Control</h2>

  <div class="d-flex gap-2">
    <!-- Pause (shown when running and not paused) -->
    <form hx-post="/pause" hx-swap="none" x-show="!isPaused">
      <button class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pause-fill me-1" viewBox="0 0 16 16">
          <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/>
        </svg>
        Pause
      </button>
    </form>

    <!-- Resume (shown when paused) -->
    <form hx-post="/resume" hx-swap="none" x-show="isPaused">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill me-1" viewBox="0 0 16 16">
          <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
        </svg>
        Resume
      </button>
    </form>

    <!-- Stop -->
    <form hx-post="/stop" hx-swap="none">
      <button class="btn btn-danger">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stop-fill me-1" viewBox="0 0 16 16">
          <path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5"/>
        </svg>
        Stop
      </button>
    </form>
  </div>
</section>
