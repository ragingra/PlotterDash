<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span><i class="bi bi-activity me-2"></i>Plotter</span>
    <span class="badge" :class="isRunning ? (isPaused ? 'text-bg-warning' : 'text-bg-primary') : 'text-bg-light border'"
          x-text="isRunning ? (isPaused ? 'Paused' : 'Plotting') : 'Idle'"></span>
  </div>
  <div class="card-body">
    <template x-if="currentJob">
      <div>
        <div class="fw-semibold text-truncate" x-text="currentJob.filename" :title="currentJob.filename"></div>
        <div class="small text-muted mb-2">
          <span x-text="currentJob.current_index + ' / ' + currentJob.total_commands + ' commands'"></span>
          <template x-if="currentJob.warnings"><span class="text-warning ms-2" x-text="currentJob.warnings + ' plotter error(s)'"></span></template>
        </div>
        <div class="progress mb-1">
          <div class="progress-bar" :class="{'progress-bar-striped progress-bar-animated': !isPaused}"
               :style="'width:' + currentJob.progress_percent + '%'"></div>
        </div>
        <div class="d-flex justify-content-between small text-muted mb-3">
          <span x-text="currentJob.progress_percent + '%'"></span>
          <span x-text="fmtDuration(currentJob.elapsed_seconds) + ' elapsed · ~' + fmtDuration(remaining(currentJob)) + ' left'"></span>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-secondary btn-sm flex-fill" x-show="!isPaused" @click="post('/pause')"><i class="bi bi-pause-fill me-1"></i>Pause</button>
          <button class="btn btn-primary btn-sm flex-fill" x-show="isPaused" x-cloak @click="post('/resume')"><i class="bi bi-play-fill me-1"></i>Resume</button>
          <button class="btn btn-danger btn-sm flex-fill" @click="post('/stop')"><i class="bi bi-stop-fill me-1"></i>Stop</button>
        </div>
        <div class="small text-muted mt-2">Pause lifts the pen. Stop lifts the pen and returns it to the carousel.</div>
      </div>
    </template>

    <template x-if="!currentJob">
      <div class="text-muted small">
        <span x-show="!isConnected">Connect to start plotting. Jobs can be queued while offline.</span>
        <span x-show="isConnected && queuedCount === 0">No job running. Queue an SVG to begin.</span>
        <span x-show="isConnected && queuedCount > 0 && queueHeld" x-cloak>Queue is on hold.</span>
        <span x-show="isConnected && queuedCount > 0 && !queueHeld" x-cloak>Starting next job…</span>
      </div>
    </template>

    <hr class="my-3" />
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="holdQueue" :checked="queueHeld"
             @change="post('/queue/hold', new URLSearchParams({held: $event.target.checked ? 1 : 0}))" />
      <label class="form-check-label small" for="holdQueue">
        Hold queue <span class="text-muted">(finish current job, don't start the next)</span>
      </label>
    </div>
  </div>
</div>
